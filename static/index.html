<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">

    <nav class="bg-emerald-600 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold font-mono">Calendar</h1>
        <div id="user-info" class="flex items-center space-x-3">
            <span class="text-sm bg-emerald-700 px-3 py-1 rounded-full">Login</span>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto my-6 p-4 bg-white rounded-xl shadow-lg">
        <div id="calendar"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var calendarEl = document.getElementById('calendar');
            
            // 初始化 FullCalendar 實例
            var calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                locale: 'zh-tw',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,timeGridDay'
                },
                    events: function(fetchInfo, successCallback, failureCallback) {
                    // 用前端的 fetch 發出 GET 請求給我們剛寫好的 API (先寫死 user 1)
                    fetch('/users/1/events')
                        .then(response => response.json())
                        .then(data => {
                            // 把後端的欄位名稱，翻譯成 FullCalendar 看得懂的格式
                            var formattedEvents = data.map(function(item) {
                                return {
                                    id: item.id,
                                    title: item.title,
                                    start: item.start_time, 
                                    end: item.end_time, 
                                    allDay: item.is_all_day, 
                                    extendedProps: {
                                        description: item.description,
                                        is_completed: item.is_completed
                                    },
                                    backgroundColor: item.is_all_day ? '#db2777' : '#059669', // 整日粉紅，一般翠綠
                                    borderColor: 'transparent'
                                };
                            });
                            
                            // 成功！把翻譯好的資料餵給 FullCalendar 畫出來
                            successCallback(formattedEvents);
                        })
                        .catch(error => {
                            console.error('撈取行程失敗:', error);
                            failureCallback(error);
                        });
                }
            });
            
            // 渲染畫布！
            calendar.render();
        });
    </script>
</body>
</html>
